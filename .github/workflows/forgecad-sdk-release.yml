name: ForgeCAD SDK Release

on:
  push:
    branches:
      - forgemind/1.1.3-sdk-release
    tags:
      - forgecad-sdk-v1.1.3-*
permissions:
  contents: read

concurrency:
  group: forgecad-sdk-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and verify FreeCAD SDK (Linux x86_64)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out FreeCAD fork
        uses: actions/checkout@v4

      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build swig patchelf \
            libboost-filesystem-dev libboost-program-options-dev libboost-regex-dev \
            libboost-system-dev libboost-thread-dev libeigen3-dev libfmt-dev libyaml-cpp-dev \
            libxerces-c-dev libocct-data-exchange-dev libocct-ocaf-dev libtbb-dev \
            libfreetype-dev libdouble-conversion-dev zlib1g-dev libssl-dev libffi-dev \
            libbz2-dev liblzma-dev libreadline-dev libsqlite3-dev

      - name: Run SDK source contract tests
        run: python3 -E -B -m unittest discover -s forgecad/tests -v

      - name: Build and package FreeCAD SDK
        env:
          SDK_WORK: ${{ runner.temp }}/forgecad-sdk-work
        run: |
          python3 -E -B forgecad/sdk.py package --work "$SDK_WORK" --jobs 2
          python3 -E -B forgecad/sdk.py verify --work "$SDK_WORK"

      - name: Verify private capability query against built FreeCAD libraries
        env:
          SDK_WORK: ${{ runner.temp }}/forgecad-sdk-work
        run: |
          c++ -std=c++17 -I forgecad/resources forgecad/tests/sdk_query_tests.cpp \
            -ldl -o "$RUNNER_TEMP/forgecad-sdk-query-tests"
          LD_LIBRARY_PATH="$SDK_WORK/package/runtime/lib:$SDK_WORK/package/runtime/python/lib:$SDK_WORK/package/qt/lib" \
            "$RUNNER_TEMP/forgecad-sdk-query-tests" "$SDK_WORK/package/runtime/lib/libFreeCADApp.so" \
            > "$RUNNER_TEMP/forgecad-sdk-capability.json"
          test -s "$RUNNER_TEMP/forgecad-sdk-capability.json"
          echo "FreeCAD 1.1.3 ForgeCAD capability query passed."

      - name: Verify the final distributable archive
        run: |
          archive="$GITHUB_WORKSPACE/dist/forgecad-sdk-1.1.3-python3.11.9-x86_64-unknown-linux-gnu.tar.gz"
          sha_file="$archive.sha256"
          test -f "$archive"
          (cd "$(dirname "$archive")" && sha256sum -c "$(basename "$sha_file")")
          verify_dir="$RUNNER_TEMP/forgecad-sdk-release-verify"
          mkdir -p "$verify_dir"
          tar -xzf "$archive" -C "$verify_dir"
          python3 -E -B "$verify_dir/forgecad-sdk/tools/verify_sdk.py" \
            --manifest "$verify_dir/forgecad-sdk/forgecad-sdk-export.json" \
            --target x86_64-unknown-linux-gnu \
            --abi "$GITHUB_WORKSPACE/forgecad/resources/forgecad_sdk_python_v1.h" \
            > "$RUNNER_TEMP/forgecad-sdk-final-verification.json"
          test -s "$RUNNER_TEMP/forgecad-sdk-final-verification.json"
          echo "Packaged SDK verifier passed for x86_64-unknown-linux-gnu."
          if find "$verify_dir/forgecad-sdk" -name 'libforgecad_runtime.so' -print -quit | grep -q .; then
            echo 'Private compiler bridge must not be present in the public SDK release.' >&2
            exit 1
          fi

      - name: Upload validated SDK package for release job
        uses: actions/upload-artifact@v4
        with:
          name: forgecad-sdk-1.1.3-x86_64-unknown-linux-gnu
          path: |
            dist/forgecad-sdk-1.1.3-python3.11.9-x86_64-unknown-linux-gnu.tar.gz
            dist/forgecad-sdk-1.1.3-python3.11.9-x86_64-unknown-linux-gnu.tar.gz.sha256
          if-no-files-found: error

  release:
    name: Publish validated release assets
    if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'forgecad-sdk-v1.1.3-')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download validated SDK assets
        uses: actions/download-artifact@v4
        with:
          name: forgecad-sdk-1.1.3-x86_64-unknown-linux-gnu
          path: dist

      - name: Publish GitHub Release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          archive="dist/forgecad-sdk-1.1.3-python3.11.9-x86_64-unknown-linux-gnu.tar.gz"
          gh release create "$GITHUB_REF_NAME" "$archive" "$archive.sha256" \
            --title "ForgeCAD SDK $GITHUB_REF_NAME" \
            --notes "FreeCAD 1.1.3 ForgeCAD SDK for Linux x86_64. The archive contains FreeCAD, CPython and Qt runtime files; it does not contain the private compiler bridge. Verify the attached SHA-256 file before extraction."
